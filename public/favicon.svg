<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="canopy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Filled canopy dome -->
  <path d="M3 17 C3 7, 9 2, 16 2 C23 2, 29 7, 29 17 Z" fill="url(#canopy)" fill-opacity="0.3" stroke="url(#canopy)" stroke-width="1.5"/>
  <!-- Top tip -->
  <circle cx="16" cy="2" r="1.5" fill="#94a3b8"/>
  <!-- Pole -->
  <line x1="16" y1="17" x2="16" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- J-hook handle -->
  <path d="M16 26 Q16 29.5 13 29.5 Q10 29.5 10 27" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
